# Keeps the Supabase project from pausing itself.
#
# Free-tier projects are paused after a week of "too little database
# activity", and this site is static — nothing touches the database unless a
# visitor submits a form. A quiet week is enough to take the contact form, the
# email signup and /filedrop offline, silently: the pages still load,
# submissions just fail.
#
# History, because each version of this failed in a different way:
#   - 2026-09-01: first pause, unnoticed for three weeks.
#   - v1 needed a repository secret added by hand; that never happened, so it
#     failed daily from 2026-09-26 and the project paused again ~2026-09-30.
#   - v2 (2026-10-03) put the publishable key in this file and passed every
#     day — but made one read a day that RLS answers with zero rows, and
#     Supabase still warned in November that the project was about to pause.
#     One empty read a day evidently doesn't count as enough activity.
#
# v3, this version:
#   - WRITES. keepalive_ping() (supabase/migrations/006_keepalive_heartbeat.sql)
#     updates a single heartbeat row, which is unambiguous database activity.
#   - Four times a day instead of once.
#   - Keeps the repository itself active (see the `stay-enabled` job), because
#     GitHub disables scheduled workflows in public repos after 60 days with
#     no repository activity — which would have stopped this around
#     2026-12-20 with nobody noticing.
#
# The key below is the publishable key (sb_publishable_...), which Supabase
# designs to be shared: it already ships in the site's JS bundle. RLS is the
# real protection. The service role key must NEVER appear in this repo.
#
# The only guarantee against pausing is the paid Pro plan. This is the
# strongest free option.

name: Supabase keepalive

on:
  schedule:
    # Every 6 hours, on an odd minute: jobs on the hour are the most likely to
    # be delayed or dropped when GitHub is busy.
    - cron: "17 3,9,15,21 * * *"
    # 1st of each month: keep the repository active (stay-enabled job).
    - cron: "41 12 1 * *"
  # Lets you run it by hand from the Actions tab to confirm it works.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://gdyoudoxqbmqcsskwqan.supabase.co
      # Publishable key — see the note at the top of this file.
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_JxBswl0CtCd_ncWVq9HnRQ_HVRttZb9
    steps:
      - name: Write a heartbeat to the database
        run: |
          # POST to the RPC endpoint runs keepalive_ping(), which updates one
          # row. A 200 proves Postgres executed a write, not merely that the
          # edge answered: a paused project returns 000/5xx, and during a
          # restore the edge briefly returns 401/404 while Postgres comes up.
          response=$(curl -sS -w '\n%{http_code}' --max-time 30 \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/keepalive_ping" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)

          echo "Supabase responded HTTP ${code}: ${body}"

          if [ "$code" = "404" ]; then
            echo "::error::keepalive_ping() not found — run"
            echo "supabase/migrations/006_keepalive_heartbeat.sql in the"
            echo "Supabase SQL editor."
            exit 1
          fi

          if [ "$code" != "200" ]; then
            echo "::error::Expected HTTP 200. The project may be paused, or"
            echo "the publishable key may have been rotated. Check"
            echo "https://supabase.com/dashboard/project/gdyoudoxqbmqcsskwqan"
            exit 1
          fi

          echo "Heartbeat written."

  stay-enabled:
    # Only on the monthly schedule (or a manual run), not every 6 hours.
    if: github.event.schedule == '41 12 1 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit a monthly heartbeat so GitHub keeps this workflow on
        run: |
          # A commit counts as repository activity and resets GitHub's
          # 60-day clock. Touches only this one file. Note: any push to main
          # also triggers a (harmless) Cloudflare rebuild of the site.
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive-heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive-heartbeat
          git commit -m "Monthly keepalive heartbeat" || { echo "Nothing to commit"; exit 0; }
          git push
